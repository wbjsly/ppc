server:
  port: 8090

spring:
  profiles:
    active: mysql
  application:
    name: erp-system

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.erp.entity
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: delFlag
      logic-delete-value: '1'
      logic-not-delete-value: '0'
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: ErpSecretKey2026ForJwtTokenGenerationAndValidation0123456789
    expiration: 86400000
  proc:
    # 招标参数（design D9：走 yml + @Value，不建参数表；与 min-quote-count 同范式）
    tender-threshold-amount: 1000000  # 招标门槛金额（BR-4.2-44，默认 100 万）
    publicity-days: 3            # 公示期（BR-4.2-48，默认 3 个工作日）
    agreement-valid-months: 12   # 框架协议有效期（BR-4.2-05，默认 12 个月）
  db:
    bootstrap:
      enabled: true
      location: classpath:db/mysql/
      skip-scripts:
