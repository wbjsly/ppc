spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowMultiQueries：测试/冒烟清理须在同一连接执行 `SET @audit_bypass=1; DELETE ...`
    # （会话变量按连接生效，触发器豁免适配 add-audit-log-console task 3.3）
    url: jdbc:mysql://localhost:3306/erp?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: root123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
