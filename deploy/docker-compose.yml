# 基础设施编排（01 文档 1.3）：MySQL 必备；
# Redis / MinIO / RabbitMQ / Nginx 等服务随对应业务模块落地时补充。
services:
  mysql:
    image: mysql:8.0
    container_name: erp-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: erp
      TZ: Asia/Shanghai
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
