schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 项目：企业级 ERP 系统
  18 个业务域的完整功能蓝图，当前处于平台底座期：认证、RBAC、动态菜单已实现，
  业务域按 docs/design/08-erp-menu.md（164 二级 / 497 三级菜单）逐域推进。
  已完成：法人主体（1.1.1）、成本中心（1.1.2）。

  ## 技术栈
  - 后端：Java 17 + Spring Boot 2.7.18 + MyBatis-Plus 3.5.5 + Druid，JWT（jjwt），
    Knife4j 文档 /doc.html，端口 8090
  - 前端：Vue 3.4 + Element Plus 2.6.1 + Vite 5.2，Vue Router 4 + Pinia，端口 4185
  - 数据库：MySQL 8.0（Docker，库 erp）
  - 构建：Maven；JAVA_HOME 须指向 /Users/macmini/Desktop/taizhi/31Tech/40Tools/jdk-17
    （机器默认 java 是 11 不可用）；~/.zshrc 全局 JAVA_HOME 不允许改

  ## 约定
  - 分层：Controller → Service 接口 → ServiceImpl → DAO → Entity（必须有 Service 接口层）；
    包根 com.erp，统一响应 common/R.java，实体继承 BaseEntity（审计字段 + DEL_FLAG 逻辑删除 + VER_NO 乐观锁）
  - 表命名（强制）：erp_{业务域前缀}_{表名}，全小写下划线；20 个域前缀对照见
    docs/design/01-architecture-style.md 1.4 节（mdm/procurement/sd/wms/mrp/qms/eam/finance/
    tax/hr/crm/rd/pm/scm/iot/bi/portal/admin/i18n/ops）；连字符与 & 禁用
  - 迁移：自研 DbBootstrap 扫 classpath:db/mysql/*.sql 按序执行，marker 表记录；
    文件编号 NNN-模块-描述.sql，追加末尾编号；必须幂等（IF NOT EXISTS + INSERT IGNORE）；
    099-menu-seed.sql 由 generate-menu-seed.cjs 生成，勿手工编辑
  - 主数据治理模式：集中管控、分权维护、审批发布；已建模块基线 = 无审批、立即生效、
    版本快照（快照记该版本状态/变更后新值）、乐观锁、禁止硬删、编码创建后不可改
  - 权限：写接口 hasRole("ADMIN")，未认证 401，ROLE_USER 写 403

  ## 重要约束
  - 规格 docs/design/00-erp-spec.md 中 Flowable/RabbitMQ/Redis/MinIO 等为目标态，
    当前代码未落地；与规格的偏差须在 proposal 中以偏差表显式记录
  - 首个下游模块落地时须回补停用校验桩（legal_entity_id / cost_center_id 引用查询）
